schema_version: 1

context:
  version: "0.0.3"

package:
  name: ophyd-service
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/ophyd-service/ophyd_service-${{ version }}.tar.gz
  sha256: ce633d53243372c6a53b396d7558a4ef28e4640ca4b7d96428263244d43edef6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - alembic
    - bluesky-queueserver
    - ophyd-async
    - h5py
    - cachetools
    - fastapi
    - httpx2
    - ldap3
    - orjson
    - pamela
    - pydantic >=2,<3
    - pydantic-settings >=2
    - python-jose
    - pyzmq
    - sqlalchemy >=2
    - starlette
    - uvicorn

tests:
  - python:
      imports:
        - ophyd_service
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: REST API Server for Ophyd Objects.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/ophyd-service/

extra:
  recipe-maintainers:
    - dmgav
    - mrakitin
    - tacaswell
